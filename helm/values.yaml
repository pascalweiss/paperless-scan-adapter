replicaCount: 1

image:
  repository: registry.pwlab.dev/paperless-scan-adapter
  tag: "0.2.1"
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

strategy:
  type: Recreate

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Enabled so Prometheus has a stable target for /metrics. Nothing else talks to this
# workload; the port serves /healthz, /readyz and /metrics only. Keep in sync with
# config.data.HEALTH_PORT, the probes reference the same number.
service:
  enabled: true
  type: ClusterIP
  port: 8080
  annotations: {}
  labels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

config:
  enabled: true
  nameOverride: ""
  annotations: {}
  extraLabels: {}
  data:
    VALIDATION_RETRY_COUNT: "5"
    VALIDATION_RETRY_BASE_WAIT_SECONDS: "10"
    UPLOAD_RETRY_COUNT: "3"
    UPLOAD_RETRY_BASE_WAIT_SECONDS: "5"
    SCAN_INTERVAL_SECONDS: "5"
    PAPERLESS_API_URL: "http://paperless-ngx.paperless-ngx.svc.cluster.local:8000"
    SCAN_FOLDER_PATH: "/mnt/scan/scan"
    ARCHIVE_FOLDER_PATH: "/mnt/scan/scan/archive"
    LOG_LEVEL: "INFO"
    PAPERLESS_ADMIN_USER: "admin"
    HEALTH_PORT: "8080"
    HEALTH_STALE_AFTER_SECONDS: "120"

env:
  extraEnv: []
  secretRefs:
    - name: PAPERLESS_ADMIN_PASSWORD
      secretName: paperless-admin
      secretKey: password
      optional: false
  extraEnvFrom: []

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

# The worker is a polling loop with no inbound traffic, so these probes exist for one
# reason: a wedged loop (a blocking read on a stale SMB handle) leaves the process
# "Running" forever while no scan is processed. /healthz reports the loop heartbeat and
# turns 503 once it goes stale, which converts a silent stall into a visible restart.
# Keep the port in sync with config.data.HEALTH_PORT.
livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

persistence:
  enabled: true
  claimName: paperless-scan-adapter-smb
  existingClaim: ""
  mountPath: /mnt/scan
  subPath: ""
  accessModes:
    - ReadWriteMany
  size: 1Gi
  storageClassName: smb-paperless-scan
  volumeName: paperless-scan-adapter-pv
  annotations: {}
  selector: {}
  persistentVolume:
    enabled: true
    name: paperless-scan-adapter-pv
    annotations: {}
    extraLabels: {}
    spec:
      capacity:
        storage: 1Gi
      accessModes:
        - ReadWriteMany
      persistentVolumeReclaimPolicy: Retain
      storageClassName: smb-paperless-scan
      mountOptions:
        - vers=3.0
        - dir_mode=0777
        - file_mode=0777
        - uid=1000
        - gid=1000
        - cache=strict
        - actimeo=30
      csi:
        driver: smb.csi.k8s.io
        volumeHandle: paperless-scan-adapter-pv
        volumeAttributes:
          source: "//192.168.8.52/homelab-share"
        nodeStageSecretRef:
          name: paperless-smb-credentials
          namespace: paperless-ngx

volumeMounts: []
volumes: []

nodeSelector: {}
tolerations: []
affinity: {}

namespace:
  create: false
  annotations: {}
